<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سایت در حال به‌روزرسانی</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #faf9f7;
            color: #292724;
            font-family: Tahoma, Arial, sans-serif;
            padding: 24px;
        }
        .container {
            width: 100%;
            max-width: 520px;
            text-align: center;
            padding: 55px 30px;
            background: #ffffff;
            border: 1px solid #ebe7e1;
            border-radius: 24px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.05);
        }
        .icon {
            width: 72px;
            height: 72px;
            margin: 0 auto 28px;
            border: 1px solid #d8d2c9;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
        }
        h1 {
            font-size: 25px;
            font-weight: 500;
            margin-bottom: 18px;
        }
        p {
            font-size: 15px;
            line-height: 2;
            color: #77716a;
        }
        .line {
            width: 45px;
            height: 1px;
            background: #cfc8be;
            margin: 28px auto;
        }
        .small {
            font-size: 12px;
            color: #aaa39a;
        }
        @media (max-width: 480px) {
            .container {
                padding: 45px 22px;
            }
            h1 {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
    <main class="container">
        <div class="icon">✦</div>
        <h1>سایت در حال به‌روزرسانی است</h1>
        <div class="line"></div>
        <p>
            در حال انجام تغییرات و به‌روزرسانی سایت هستیم.
            <br>
            به‌زودی دوباره در دسترس خواهیم بود.
        </p>
        <br>
        <span class="small">
            لطفاً بعداً دوباره مراجعه کنید.
        </span>
    </main>
</body>
</html>
